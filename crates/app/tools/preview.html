<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Pip preview</title>
  <!-- Dev tool: runs ui/main.js in a normal browser with a fake Tauri bridge and an invented form
       behind it. Scenes: #onboarding #story #card #reminder #error #deadlines #ask #sleep #drag #celebrate #listen
       #stats #stats_de #hold #celebrate_race #guard #peek-rest #peek-hover #peek-open #peek-story #peek-back (all invented data). ?shot=1 = for tools/shot.sh (headless screenshot when the
       scene is ready); &reduce=1 = pretend the user asked for reduced motion; &mode=always = tray "Always show Pip";
       &peek=N = PIP_PEEK_SECS. The peek scenes draw a 48 px taskbar that Pip must never cover. -->
  <base href="../ui/">
  <link rel="stylesheet" href="style.css">
  <style>
    #desk { position: fixed; inset: 0; z-index: -1; background: linear-gradient(160deg, #dfe7f3, #c9d4e6); font-family: "Segoe UI", system-ui, sans-serif; }
    #desk .win { position: absolute; left: 12%; top: 14%; width: 46%; height: 64%; background: #fff; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.18); }
    #desk .bar { height: 40px; background: #f1f3f7; border-radius: 10px 10px 0 0; border-bottom: 1px solid #e3e6ee; padding: 9px 16px; font-size: 15px; color: #555; }
    #desk label { position: absolute; font-size: 15px; color: #333; }
    #desk .f { position: absolute; border: 1px solid #b9c0cc; border-radius: 6px; background: #fff; }
    #desk .send { position: absolute; background: #2e7d32; color: #fff; border-radius: 6px; display: grid; place-items: center; font-size: 17px; }
    #desk .file { position: absolute; background: #eceff4; border: 1px solid #b9c0cc; border-radius: 6px; display: grid; place-items: center; font-size: 15px; }
    #desk .taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: rgba(32, 36, 44, .92); display: flex; align-items: center; justify-content: center; gap: 14px; }
    #desk .taskbar i { width: 28px; height: 28px; border-radius: 7px; background: rgba(255, 255, 255, .28); }
    #desk .taskbar .clock { position: absolute; right: 18px; color: #e8ecf3; font: 14px "Segoe UI", system-ui, sans-serif; }
    #log { position: fixed; left: 8px; bottom: 8px; font: 12px monospace; color: #345; max-width: 40vw; white-space: pre; opacity: .7; }
  </style>
  <script>
  (() => {
    const S = {
      onb_hello: "Hallo! Ich bin Pip. Ich helfe dir mit Briefen und Fristen.", onb_ask_name: "Wie darf ich dich nennen?",
      onb_next: "Weiter", onb_privacy: "Deine Briefe bleiben auf diesem Computer. Zum Lesen schicke ich nur das Bild an Meta.",
      onb_drop_letter: "Zieh einen Brief auf mich. Oder drück hier:", onb_name_placeholder: "Dein Vorname",
      onb_ask_state: "Wohnst du in Nordrhein-Westfalen?", onb_state_pick: "In welchem Bundesland wohnst du?",
      states_list: "Baden-Württemberg|Bayern|Berlin|Brandenburg|Bremen|Hamburg|Hessen|Mecklenburg-Vorpommern|Niedersachsen|Nordrhein-Westfalen|Rheinland-Pfalz|Saarland|Sachsen|Sachsen-Anhalt|Schleswig-Holstein|Thüringen",
      btn_pick_letter: "Brief auswählen", btn_yes: "Ja", btn_elsewhere: "Woanders", ask_what: "Was soll ich tun?",
      ask_placeholder: "Schreib es hier hin. Oder halte das Mikrofon gedrückt.", btn_go: "Los", btn_mic: "Gedrückt halten und sprechen",
      btn_close: "Schließen", btn_ok: "Gut", thinking: "Ich schaue mir das an …", btn_stop: "Stopp",
      btn_resume: "Weiter", btn_why: "Warum?", btn_retry: "Nochmal", btn_later: "Später", approve_attachments: "Anhang",
      approve_button_preview: "Diesen Knopf drücke ich:", drop_hint: "Lass den Brief los. Ich lese ihn.",
      deadlines_title: "Deine Fristen", tray_deadlines: "Meine Fristen", deadlines_none: "Du hast gerade keine offenen Fristen.",
      hint_not_legal_advice: "Das ist ein Hinweis, keine Rechtsberatung.",
      // English, as the real app shows them (Lang::En)
      done_time: "Done in {secs} s. By hand this takes about {minutes} minutes.",
      done_time_one: "Done in {secs} s. By hand this takes about a minute.",
      done_total: "That's about {total} saved since we met.",
      heard: "I understood: \"{text}\"", listening: "I'm listening …",
      tray_knowledge: "What Pip knows", btn_pause_link: "Take a break",
      peek_hint: "Need help? Click me", ask_what: "What shall I do?", btn_go: "Go", btn_mic: "Hold and talk",
      ask_placeholder: "Type it here. Or hold the microphone.", btn_look_screen: "Look at my screen",
      chip_send_au: "Send my sick note", chip_last_letter: "My last letter", chip_deadlines: "My deadlines",
      btn_pick_letter: "Pick a letter", tray_deadlines: "My deadlines", btn_my_card: "What Pip did for me",
    };
    const params = new URLSearchParams(location.search);
    const SHOT = params.has("shot");
    // Headless screenshot: keep the window's load event open until the scene is drawn.
    const slow = (ms) => { const i = new Image(); i.alt = ""; i.hidden = true; i.src = `/slow?ms=${ms}&t=${Math.random()}`; document.documentElement.append(i); };
    if (SHOT) slow(1500);
    // How long each scene runs before the screenshot (ms after the scene starts).
    const SCENE = location.hash.slice(1) || "onboarding";
    const PEEK_SCENE = SCENE.startsWith("peek");
    const SHOT_AT = { "peek-rest": 400, "peek-hover": 1700, "peek-open": 900, "peek-story": 9500, "peek-back": 3200, celebrate: 450, celebrate_race: 450, story: 5200, card: 900, listen: 900, stats: 700, stats_de: 700, hold: 900, ask: 700, onboarding: 700, guard: 1100 };
    if (params.has("reduce")) {
      const real = window.matchMedia.bind(window);
      window.matchMedia = (q) => q.includes("reduce") ? { matches: true, media: q, addEventListener() {}, removeEventListener() {} } : real(q);
    }
    const handlers = {};
    window.addEventListener("error", (e) => log("ERR " + e.message + " @" + e.lineno));
    window.addEventListener("unhandledrejection", (e) => log("REJ " + (e.reason && e.reason.message || e.reason)));
    const emit = (name, payload) => (handlers[name] || []).forEach((cb) => cb({ payload }));
    var log = (m) => { const l = document.getElementById("log"); if (l) l.textContent = (m + "\n" + l.textContent).slice(0, 900); };
    const dpr = () => window.devicePixelRatio || 1;
    const rect = (x, y, w, h) => ({ x: Math.round(innerWidth * x * dpr()), y: Math.round(innerHeight * y * dpr()), w: Math.round(innerWidth * w * dpr()), h: Math.round(innerHeight * h * dpr()) });
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    let approve = null;
    let approveSoon = false; // peek-story: every card says yes by itself after 700 ms
    window.__TAURI__ = {
      core: {
        invoke: async (cmd, args) => {
          if (cmd === "ui_strings") return S;
          if (cmd === "overlay_info") return {
            x: 0, y: 0, w: innerWidth * dpr(), h: innerHeight * dpr(), scale: dpr(), windowed: false,
            mode: params.get("mode") || "peek", peek_secs: Number(params.get("peek") ?? (SCENE === "peek-story" || SCENE === "peek-back" ? 1 : 10)),
            taskbar_css: PEEK_SCENE ? 48 : 0,
          };
          if (cmd === "ui_ready") {
            if (SHOT) { const name = location.hash.slice(1) || "onboarding"; slow(SHOT_AT[name] ?? 1000); scene(); } else setTimeout(scene, 300);
            return;
          }
          if (cmd === "ui_command" && args.cmd.type !== "hit_rects") {
            log(JSON.stringify(args.cmd));
            if (args.cmd.type === "approve" && approve) approve(args.cmd.answer);
            if (args.cmd.type === "onboarding_answer" && args.cmd.step === "ask_name") {
              emit("ui", { type: "pip", state: "happy" });
              emit("ui", { type: "bubble", text: `Schön, dich kennenzulernen, ${args.cmd.value}!`, buttons: [], question_id: null });
              await wait(2600); emit("ui", { type: "pip", state: "idle" }); emit("ui", { type: "onboarding", step: "first_letter" });
            }
            if (args.cmd.type === "text") story();
          }
        },
      },
      event: { listen: async (name, cb) => { (handlers[name] ||= []).push(cb); } },
    };
    // Self-check: the stat chips must leave the bubble's text byte-identical (main.js compares it).
    const ui = (ev) => {
      emit("ui", ev);
      if (ev.type === "bubble") setTimeout(() => {
        // a guard bubble shows only its first line as the text (the rest become chips)
        const want = ev.buttons.some((b) => b.id.startsWith("guard:")) ? ev.text.split("\n")[0] : ev.text;
        const got = document.getElementById("bubble-text").textContent;
        const chips = document.querySelectorAll("#bubble-text .stat").length;
        if (got !== want) { console.error("bubble text changed", got); log("ERROR bubble text changed by decorateStats"); } else log(`bubble ok, ${chips} stat chip(s)`);
      }, 60);
    };
    const press = (type) => document.getElementById("pip").dispatchEvent(new PointerEvent(type, { bubbles: true, pointerId: 7, button: 0, isPrimary: true, clientX: 0, clientY: 0 }));
    async function card(title, yes) {
      ui({ type: "approval_request", card: { id: crypto.randomUUID(), title, what: "Was: deine Krankschreibung 20.10.–30.10.", to: "An: Evergreen Health (Kontaktformular)", attachments: ["krankschreibung_beispiel.pdf"], crop_png_b64: null, yes_label: yes, no_label: "Noch nicht" } });
      if (approveSoon) setTimeout(() => document.getElementById("card-yes").click(), 700);
      return new Promise((r) => (approve = r));
    }
    async function story() {
      emit("app", { type: "acting", on: true });
      ui({ type: "pip", state: "thinking" }); ui({ type: "progress", text: "Ich schaue mir das an …" }); await wait(1500);
      ui({ type: "pip", state: "acting" }); ui({ type: "point_at", rect: rect(0.18, 0.30, 0.30, 0.05), label: "Name" }); ui({ type: "progress", text: "Ich trage deinen Namen ein." }); await wait(1800);
      ui({ type: "point_at", rect: rect(0.18, 0.40, 0.30, 0.05), label: "Versichertennummer" }); ui({ type: "progress", text: "Ich trage deine Versichertennummer ein." }); await wait(1800);
      ui({ type: "point_at", rect: rect(0.18, 0.50, 0.14, 0.05), label: "Datei anhängen" }); ui({ type: "pip", state: "asking" }); ui({ type: "progress", text: "" });
      if (await card("Darf ich die Krankschreibung anhängen?", "Ja, anhängen") !== "yes") return;
      ui({ type: "point_at", rect: rect(0.36, 0.62, 0.12, 0.06), label: "Absenden" }); ui({ type: "pip", state: "asking" });
      if (await card("Darf ich das abschicken?", "Ja, abschicken") !== "yes") return;
      ui({ type: "pip", state: "acting" }); ui({ type: "progress", text: "Ich klicke auf Absenden." }); await wait(1200);
      ui({ type: "point_clear" }); ui({ type: "fly_home" }); ui({ type: "progress", text: "" }); ui({ type: "pip", state: "happy" });
      ui({ type: "bubble", text: "Erledigt. Ich merke mir: Krankschreibung ist bei Evergreen Health.", buttons: [], question_id: null });
      emit("app", { type: "acting", on: false }); await wait(2000); ui({ type: "pip", state: "idle" });
    }
    // Where Pip is: "rest" | "hover" | "up", and whether his visible part ends above the taskbar.
    const peekState = () => {
      const pip = document.getElementById("pip");
      const state = pip.classList.contains("peek-rest") ? "rest" : pip.classList.contains("peek-hover") ? "hover" : "up";
      const r = pip.getBoundingClientRect();
      return `${state} y=${Math.round(r.top)}`;
    };
    function scene() {
      const name = SCENE;
      if (name === "onboarding") ui({ type: "onboarding", step: "ask_name" });
      if (name === "letter") ui({ type: "onboarding", step: "first_letter" });
      if (name === "story") story();
      if (name === "card") { ui({ type: "point_at", rect: rect(0.36, 0.62, 0.12, 0.06), label: "Absenden" }); ui({ type: "pip", state: "asking" }); emit("app", { type: "acting", on: true }); card("Darf ich das abschicken?", "Ja, abschicken"); }
      if (name === "reminder") { ui({ type: "pip", state: "asking" }); ui({ type: "reminder", reminder_id: 1, text: "Deine Krankschreibung endet morgen. Wenn du noch krank bist, brauchst du bis Montag, 2. November, eine neue.", why: "Ohne lückenlose Krankschreibung kann die Krankenkasse für die fehlenden Tage kein Krankengeld zahlen. Regel: § 46 Satz 2 SGB V. Das ist ein Hinweis, keine Rechtsberatung.", buttons: [{ id: "remind:x", label: "Erinnere mich Montag", primary: true }, { id: "done", label: "Ich bin gesund", primary: false }, { id: "later", label: "Später", primary: false }] }); }
      if (name === "error") { emit("app", { type: "retryable", cmd: { type: "text", text: "x" } }); ui({ type: "pip", state: "error" }); ui({ type: "error", text: "Ich komme gerade nicht ins Internet. Ich versuche es gleich nochmal.", retry: true }); }
      if (name === "deadlines") emit("app", { type: "deadlines", items: [{ title: "Neue Krankschreibung", due: "Montag, 2. November", why: "Ohne lückenlose Krankschreibung kann die Krankenkasse für die fehlenden Tage kein Krankengeld zahlen." }, { title: "Widerspruch gegen Bescheid", due: "Freitag, 27. November", why: "Gegen einen Bescheid kannst du einen Monat lang Widerspruch einlegen." }] });
      if (name === "ask") { press("pointerdown"); setTimeout(() => press("pointerup"), 80); }
      if (name === "celebrate") {
        emit("app", { type: "acting", on: true }); ui({ type: "pip", state: "acting" });
        ui({ type: "bubble", text: "Done. I'll remember: the sick note is with the insurer. Done in 14 s. By hand this takes about 6 minutes. That's about 25 minutes saved since we met.", buttons: [], question_id: null });
        ui({ type: "pip", state: "happy" });
        setTimeout(() => { emit("app", { type: "acting", on: false }); log(`confetti pieces: ${document.querySelectorAll("#confetti i").length}`); }, 300);
      }
      if (name === "celebrate_race") {
        // the real app can deliver "acting off" a moment before "happy": the confetti must still come
        emit("app", { type: "acting", on: true }); ui({ type: "pip", state: "acting" });
        emit("app", { type: "acting", on: false });
        ui({ type: "pip", state: "happy" });
        ui({ type: "bubble", text: "Done. I'll remember: the sick note is with the insurer. Done in 14 s. By hand this takes about 6 minutes.", buttons: [], question_id: null });
        setTimeout(() => log(`confetti pieces: ${document.querySelectorAll("#confetti i").length}`), 300);
      }
      if (name === "listen") { press("pointerdown"); setTimeout(() => { ui({ type: "pip", state: "listening" }); ui({ type: "progress", text: S.listening }); }, 400); }
      if (name === "hold") {
        // a hold sends voice_start then voice_stop; a quick press after it opens the ask box (no voice)
        press("pointerdown");
        setTimeout(() => press("pointerup"), 400);
        setTimeout(() => { press("pointerdown"); setTimeout(() => press("pointerup"), 60); }, 600);
      }
      if (name === "stats") ui({ type: "bubble", text: "Done. 2nd time on this site: 14 s instead of 41 s last time.", buttons: [], question_id: null });
      if (name === "stats_de") ui({ type: "bubble", text: "Erledigt. Fertig in 14 s. Von Hand dauert das etwa 6 Minuten. Seit wir uns kennen, habe ich dir etwa 25 Minuten gespart. Zum 2. Mal auf dieser Seite: 14 s statt 41 s beim letzten Mal.", buttons: [], question_id: null });
      if (name === "sleep") { ui({ type: "pip", state: "sleeping" }); emit("app", { type: "paused", on: true }); ui({ type: "bubble", text: "Ich mache Pause. Klick mich an, dann bin ich wieder da.", buttons: [], question_id: null }); }
      if (name === "drag") emit("app", { type: "drag", state: "enter" });
      if (name === "peek-rest") log(`peek: ${peekState()}`);
      if (name === "peek-hover") {
        const pip = document.getElementById("pip");
        pip.dispatchEvent(new PointerEvent("pointerenter", { pointerId: 7, clientX: innerWidth - 60, clientY: innerHeight - 70 }));
        // the cursor sits a little left of the head: the eyes look there
        const move = () => document.dispatchEvent(new PointerEvent("pointermove", { bubbles: true, pointerId: 7, clientX: innerWidth - 260, clientY: innerHeight - 140 }));
        move(); setTimeout(move, 600); setTimeout(move, 1200);
        setTimeout(() => log(`peek: ${peekState()}, tip: ${!document.getElementById("peek-tip").hidden}`), 1300);
      }
      if (name === "peek-open") { press("pointerdown"); setTimeout(() => { press("pointerup"); setTimeout(() => log(`peek: ${peekState()}`), 500); }, 80); }
      if (name === "peek-back") {
        // a short "Done." from the edge: up while it shows, back to rest 1 s after it is closed
        ui({ type: "pip", state: "happy" });
        ui({ type: "bubble", text: "Done.", buttons: [], question_id: null });
        const up = peekState();
        setTimeout(() => { document.getElementById("bubble").click(); ui({ type: "pip", state: "idle" }); }, 600);
        setTimeout(() => log(`peek-back shown:${up} | after:${peekState()}`), 3000);
      }
      if (name === "peek-story") {
        // the scripted demo from the edge: brief, card (approved by itself), done, then back to rest after 2 s
        const seen = [];
        const note = (what) => seen.push(`${what}:${peekState()}`);
        approveSoon = true;
        ui({ type: "pip", state: "happy" });
        ui({ type: "bubble", text: "Good morning! Your sick note ends tomorrow.", buttons: [], question_id: null });
        note("brief");
        setTimeout(() => { ui({ type: "pip", state: "idle" }); document.getElementById("bubble").hidden = true; story(); }, 600);
        const iv = setInterval(() => {
          if (!document.getElementById("card").hidden && !seen.some((x) => x.startsWith("card"))) note("card");
          if (/Erledigt/.test(document.getElementById("bubble-text").textContent) && !seen.some((x) => x.startsWith("done"))) note("done");
        }, 100);
        setTimeout(() => { clearInterval(iv); note("later"); log(`peek-story ${seen.join(" | ")}`); }, 9300);
      }
      if (name === "guard") {
        // a lookalike page (invented): the core stops before typing and asks with an amber bubble
        emit("app", { type: "acting", on: true }); ui({ type: "pip", state: "asking" });
        ui({ type: "bubble", question_id: crypto.randomUUID(), buttons: [
          { id: "guard:real", label: "Take me to the real Evergreen Health", primary: true },
          { id: "guard:continue", label: "I'm sure, continue", primary: false },
        ], text: [
          "Careful: this page only looks like Evergreen Health.",
          "The web address is not the one from your letters",
          "It asks for your SMS code",
          "It says you must hurry",
          "I can be wrong. You decide, and I typed nothing here.",
        ].join("\n") });
        setTimeout(() => log(`guard chips: ${document.querySelectorAll("#bubble .sign").length}, pose: ${document.getElementById("pip-img").getAttribute("src")}`), 300);
      }
    }
  })();
  </script>
</head>
<body>
  <div id="desk">
    <div class="win"><div class="bar">Evergreen Health – Kontaktformular (Demo)</div></div>
  </div>
  <div id="log"></div>
  <!-- the real overlay markup, copied from ui/index.html at load -->
  <script>
    (async () => {
      const html = await (await fetch("index.html")).text().catch(() => "");
      const doc = new DOMParser().parseFromString(html, "text/html");
      for (const n of [...doc.body.children]) if (n.tagName !== "SCRIPT") document.body.append(n);
      const desk = document.getElementById("desk");
      if (location.hash === "#guard") {
        // an invented lookalike page: urgent red banner, member number + SMS code, red "Confirm now"
        desk.querySelector(".bar").textContent = "evergreen-health-account-check.example/confirm   |   Evergreen Health – Confirm your account";
        const add = (cls, x, y, w, h, text, css) => { const d = document.createElement("div"); d.className = cls; Object.assign(d.style, { left: x * 100 + "%", top: y * 100 + "%", width: w * 100 + "%", height: h * 100 + "%" }, css || {}); if (text) d.textContent = text; desk.append(d); };
        add("send", .14, .21, .42, .055, "Your account will be locked in 24 hours!", { background: "#fdecea", color: "#b3261e", fontWeight: "700", fontSize: "16px" });
        add("send", .14, .29, .2, .05, "Evergreen Health", { background: "none", color: "#0b6e4f", fontWeight: "800", fontSize: "24px", placeItems: "center start" });
        add("f", .18, .40, .30, .05); add("f", .18, .50, .30, .05);
        add("send", .18, .60, .16, .065, "Confirm now", { background: "#d32f2f", fontWeight: "700" });
        const lab = (t, y) => { const l = document.createElement("label"); l.textContent = t; Object.assign(l.style, { left: "18%", top: (y - .03) * 100 + "%" }); desk.append(l); };
        lab("Member number", .40); lab("SMS code", .50);
        loadScripts();
        return;
      }
      // fake form fields at the same screen fractions as the mock story
      const add = (cls, x, y, w, h, text) => { const d = document.createElement("div"); d.className = cls; Object.assign(d.style, { left: x * 100 + "%", top: y * 100 + "%", width: w * 100 + "%", height: h * 100 + "%" }); if (text) d.textContent = text; desk.append(d); };
      add("f", .18, .30, .30, .05); add("f", .18, .40, .30, .05); add("file", .18, .50, .14, .05, "Datei auswählen"); add("send", .36, .62, .12, .06, "Absenden");
      const lab = (t, y) => { const l = document.createElement("label"); l.textContent = t; Object.assign(l.style, { left: "18%", top: (y - .03) * 100 + "%" }); desk.append(l); };
      lab("Name", .30); lab("Versichertennummer", .40); lab("Krankschreibung", .50);
      // the README pictures (peek-rest, -hover, -open) without the debug log
      if (/[?&]shot=1/.test(location.search) && ["#peek-rest", "#peek-hover", "#peek-open"].includes(location.hash)) document.getElementById("log").hidden = true;
      if (location.hash.startsWith("#peek")) {
        const bar = document.createElement("div"); bar.className = "taskbar";
        bar.innerHTML = "<i></i><i></i><i></i><i></i><i></i><span class=clock>09:41</span>";
        desk.append(bar);
      }
      loadScripts();
    })();
    function loadScripts() {
      for (const src of ["peek.js", "hits.js", "main.js"]) {
        const sc = document.createElement("script"); sc.src = src; sc.async = false; document.body.append(sc);
      }
    }
  </script>
</body>
</html>
