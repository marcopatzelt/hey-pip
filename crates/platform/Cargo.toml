[package]
name = "pip-platform"
description = "Screen capture, mouse/keyboard input and UI tree per OS (Windows real, Linux stub, fake for tests)"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "pip_platform"

[dependencies]
pip-core.workspace = true
anyhow.workspace = true
tracing.workspace = true
image.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
xcap.workspace = true
enigo.workspace = true
uiautomation.workspace = true
windows-sys.workspace = true
# Only for IUIAutomation2 (UI Automation time limits); the same version and features the uiautomation crate uses.
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Accessibility"] }

[dev-dependencies]
tempfile.workspace = true
