[workspace]
resolver = "3"
members = ["crates/core", "crates/platform", "crates/cli", "crates/app"]
default-members = ["crates/core", "crates/platform", "crates/cli"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
rust-version = "1.85"
publish = false

# Every dependency any crate needs is declared here. Crates refer to it with
# `name.workspace = true`. Do not add dependencies later without the orchestrator.
[workspace.dependencies]
copilot-core = { path = "crates/core" }
copilot-platform = { path = "crates/platform" }

tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process"] }
tokio-util = "0.7"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.41", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
dotenvy = "0.15"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
async-stream = "0.3"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
cpal = "0.15"
tts = "0.26"
xcap = "0.9"
enigo = "0.6"
uiautomation = "0.25"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
# dev
wiremock = "0.6"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
